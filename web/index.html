<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="asset-version" content="20260811-sessions-3" />
    <title>知识服务Agent</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260811-sessions-3" />
    <link rel="stylesheet" href="/static/vendor/vis-network.min.css?v=20260809c" />
  </head>
  <body>
    <header class="top">
      <label class="journal-switch">
        <span class="sr-only">选择期刊</span>
        <select id="journal-select" aria-label="选择期刊">
          <option value="ZDXBNXB" selected>
            浙江大学学报（农业与生命科学版）
          </option>
          <option value="ZDXBRWB">
            浙江大学学报（人文社会科学版）
          </option>
        </select>
      </label>
      <nav class="tabs" role="tablist" aria-label="功能">
        <button class="tab is-active" data-tab="ask" type="button">问答</button>
        <button class="tab" data-tab="trends" type="button">趋势</button>
        <button class="tab" data-tab="graph" type="button">图谱</button>
      </nav>
    </header>

    <main>
      <section id="panel-ask" class="panel is-active" role="tabpanel">
        <div class="chat-layout">
          <aside class="history-rail" aria-label="当前对话历史">
            <div class="history-head">
              <div>
                <span class="history-eyebrow">当前期刊</span>
                <h2>对话记录</h2>
              </div>
              <button type="button" id="new-chat-btn" class="history-new" title="开始新对话">
                <span aria-hidden="true">＋</span><span>新对话</span>
              </button>
            </div>
            <ol id="history-list" class="history-list"></ol>
            <p id="history-empty" class="history-empty">暂无历史对话，点击“新对话”开始。</p>
          </aside>
          <div class="chat-pane">
            <div id="messages" class="messages" aria-live="polite"></div>
            <div class="composer">
              <form id="ask-form" class="ask-form">
                <input
                  id="question"
                  name="question"
                  type="text"
                  placeholder="近5年发文量前十的作者有哪些？"
                  autocomplete="off"
                  required
                />
                <button type="submit" id="ask-btn">发送</button>
                <button type="button" id="stop-btn" class="ghost stop" hidden>
                  暂停
                </button>
                <button type="button" id="reset-btn" class="ghost">清空</button>
              </form>
            </div>
          </div>
        </div>
      </section>

      <section id="panel-trends" class="panel" role="tabpanel" hidden>
        <div class="charts">
          <figure class="chart-block">
            <figcaption>
              年度发文
              <button type="button" id="clear-year-filter" class="ghost tiny" hidden>
                清除筛选
              </button>
            </figcaption>
            <div id="yearly-chart" class="chart-svg"></div>
          </figure>
          <figure class="chart-block">
            <figcaption id="keyword-caption">热门关键词</figcaption>
            <div id="keyword-chart" class="chart-svg"></div>
          </figure>
        </div>
        <div id="chart-tooltip" class="chart-tooltip" hidden></div>
      </section>

      <section id="panel-graph" class="panel" role="tabpanel" hidden>
        <form id="graph-form" class="graph-toolbar">
          <select id="graph-mode" aria-label="类型">
            <option value="author">作者</option>
            <option value="keyword">关键词</option>
            <option value="institution">机构</option>
            <option value="paper">论文</option>
          </select>
          <input
            id="graph-query"
            type="text"
            value=""
            placeholder="作者 / 关键词 / 机构 / DOI"
          />
          <button type="submit">绘制</button>
        </form>
        <div class="graph-stage">
          <div id="graph-canvas" class="graph-canvas"></div>
          <aside id="graph-legend" class="graph-legend" aria-label="节点类型筛选"></aside>
        </div>
        <p id="graph-status" class="status"></p>
      </section>
    </main>

    <script src="/static/vendor/vis-network.min.js?v=20260809c"></script>
    <script src="/static/app.js?v=20260811-sessions-3"></script>
  </body>
</html>
